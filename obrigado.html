<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: #050D1A;
    color: #F5F2EB;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(900px 420px at 72% 18%, rgba(107,114,128,.10) 0%, transparent 42%),
      radial-gradient(800px 380px at 30% 25%, rgba(10,31,61,.9) 0%, transparent 52%),
      linear-gradient(180deg, #0A1F3D 0%, #0D1525 45%, #050D1A 100%);
  }
  .wrap { max-width: 520px; width: 100%; }
  .logo { width: 80px; height: 80px; border-radius: 20px; margin: 0 auto 28px; display: block; }
  .check {
    width: 80px; height: 80px; border-radius: 50%;
    margin: 0 auto 28px;
    background: linear-gradient(135deg, rgba(107,114,128,.15), rgba(156,163,175,.1));
    border: 2px solid rgba(107,114,128,.4);
    display: flex; align-items: center; justify-content: center;
    animation: pop .5s cubic-bezier(.22,1,.36,1) both;
  }
  .check svg { width: 38px; height: 38px; color: #D1D5DB; }
  h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 800; margin-bottom: 12px; letter-spacing: -.02em; }
  p { color: #9CA3AF; font-size: 15px; line-height: 1.7; margin-bottom: 32px; }
  p strong { color: #D1D5DB; font-weight: 600; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 32px; border-radius: 999px;
    background: linear-gradient(135deg, #6B7280, #9CA3AF);
    color: #050D1A; font-weight: 700; font-size: 14px; text-decoration: none;
    transition: all .3s ease; font-family: 'Inter', sans-serif;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(107,114,128,.4); filter: brightness(1.08); }
  @keyframes pop { from { opacity: 0; transform: scale(.6) } to { opacity: 1; transform: scale(1) } }
</style>
</head>
<body>
<div class="wrap">
  <img src="https://i.ibb.co/67kvJTDc/gen-3-HCB2j42-SCUkv-QJv2-Vnuh-Lgpesh.png" alt="Blind Corp" class="logo">
  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1>Solicitação recebida!</h1>
  <p>Recebemos seus dados. Um especialista da <strong>Blind Corp</strong> entrará em contato em até <strong>24 horas úteis</strong> para agendar seu diagnóstico.</p>
  <a href="/" class="btn">Voltar ao início</a>
</div>
</body>
</html>
